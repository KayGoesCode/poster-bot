<html><head>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  body{margin:0;width:1080px;height:1350px;font-family:'Cormorant Garamond',serif;
       background:linear-gradient(170deg,{{bg1}},{{bg2}});color:{{text}};
       position:relative;overflow:hidden}
  .scene{position:absolute;left:0;bottom:0;width:1080px;height:700px}
  .arch{position:absolute;left:0;top:0;width:1080px;height:700px}
  .logo-l,.logo-r{position:absolute;top:60px;display:flex;align-items:center;gap:30px}
  .logo-l{left:70px}
  .logo-r{right:70px}
  .logo-l img,.logo-r img{max-height:130px;max-width:300px;object-fit:contain}
  .wrap{position:absolute;top:250px;left:90px;right:90px;text-align:center}
  h1{font-size:{{size}}px;font-weight:600;margin:0;line-height:1.05}
  .date{display:inline-block;margin-top:50px;border:2px solid {{accent}};
        padding:14px 46px;font-size:32px;font-weight:500;letter-spacing:12px;
        text-transform:uppercase;font-family:'Cormorant Garamond',serif}
  .tag{margin-top:45px;font-size:42px;font-style:italic;letter-spacing:4px;opacity:.9}
</style></head><body>
  <svg class="arch" viewBox="0 0 1080 700">
    <path d="M60 640 A480 480 0 0 1 1020 640" fill="none" stroke="{{text}}" stroke-opacity=".22" stroke-width="2"/>
  </svg>
  {{scene}}
  <div class="logo-l">{{logo_left}}</div>
  <div class="logo-r">{{logo_right}}</div>
  <div class="wrap">
    <h1>{{event}}</h1>
    <div class="date">{{date}}</div>
    <div class="tag">{{tagline}}</div>
  </div>
</body></html>
